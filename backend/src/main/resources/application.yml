server:
  port: 8080

spring:
  application:
    name: lowaltitude-platform
  profiles:
    # 本地开发默认激活 local profile，会额外加载 application-local.yml（该文件含真实账号，不入库）
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ---------------------------------------------------------------
  # 数据库：H2 单文件（嵌入式）
  #   · 库文件：backend/data/lowaltitude.mv.db，重启不丢数据，无需安装与密码
  #   · MODE=MySQL             建表脚本沿用 MySQL 方言（AUTO_INCREMENT / COMMENT 等）
  #   · DATABASE_TO_LOWER      表名统一小写，与 MySQL 行为一致
  #   · NON_KEYWORDS=USER      放行 user 表名（USER 在 H2 2.x 是保留字）
  #   改用 MySQL：替换 url / driver 两行并在 pom.xml 打开 mysql-connector-j，
  #   再执行 backend/sql 下的 MySQL 版脚本即可，Java 代码无需改动。
  # ---------------------------------------------------------------
  datasource:
    url: "${DB_URL:jdbc:h2:file:./data/lowaltitude;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver

  # 启动时执行建表与演示数据（每次启动重建，便于反复调试）
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:h2/schema.sql
      data-locations: classpath:h2/data.sql
      continue-on-error: false

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# JWT 配置（secret 请通过环境变量 JWT_SECRET 注入，长度不少于 32 字符）
jwt:
  secret: ${JWT_SECRET:change-me-to-a-random-string-at-least-32-characters}
  expire-hours: 72

logging:
  level:
    com.example.eduplatform: debug
